<main>
  <h2>Contact</h2>

  <form action="https://formspree.io/f/xlgwwvdp" method="POST" class="contact-form">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required>

    <label for="email">Your email</label>
    <input id="email" name="email" type="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <input type="hidden" name="_next" value="https://nicolas-fliess.com/thank-you.html">
    
    <!-- Honeypot anti-spam (leave hidden) -->
    <input type="text" name="_gotcha" style="display:none">

    <button type="submit">Send</button>
  </form>

  <p class="contact-note">
    (Your message is sent securely via a form—my email address is not displayed.)
  </p>
     
      <p>
        Profiles: 
        <a href="https://scholar.google.com/citations?user=BD3dT_oAAAAJ&hl=de&oi=ao" target="_blank" rel="noopener noreferrer">Google Scholar</a>

        · <a href="https://www.linkedin.com/in/nicolas-fliess" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </p>
    </main>

    <footer>
